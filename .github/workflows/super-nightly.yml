name: Super Nightly

# Fork-only. Rebases `super-nightly` onto pingdotgg/t3code main, gates the
# result on the release quality checks, builds the Windows installer, publishes
# it as a GitHub prerelease on this repository, and only then moves
# `super-nightly` to the rebased commit. The installed app updates from these
# releases. See docs/operations/super-nightly.md.

on:
  schedule:
    - cron: "38 9 * * *"
  workflow_dispatch:
    inputs:
      skip_sync:
        description: "Build the current super-nightly without rebasing onto upstream"
        required: false
        default: false
        type: boolean

concurrency:
  group: super-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORK_BRANCH: super-nightly
  CANDIDATE_BRANCH: super-nightly-next
  UPSTREAM_REPOSITORY: pingdotgg/t3code

jobs:
  sync:
    name: Rebase onto upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      base_sha: ${{ steps.rebase.outputs.base_sha }}
      candidate_sha: ${{ steps.rebase.outputs.candidate_sha }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      # Full clone on purpose: a sparse checkout is a blob-less partial clone,
      # and the rebase cannot lazily fetch upstream-only blobs from origin.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main

      - name: Mirror upstream main
        run: |
          if ! git push origin upstream/main:refs/heads/main; then
            echo "::warning::main is not a fast-forward of upstream/main; leaving it alone."
          fi

      - id: rebase
        name: Rebase ${{ env.FORK_BRANCH }} onto upstream/main
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_SYNC: ${{ inputs.skip_sync }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

          if [[ "${SKIP_SYNC}" == "true" ]]; then
            echo "Skipping upstream rebase; building ${base_sha}."
          elif ! git rebase upstream/main; then
            conflicts="$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')"
            git rebase --abort
            title="Upstream sync conflict on ${FORK_BRANCH}"
            body="$(printf 'Rebasing `%s` (%s) onto `%s` main (%s) stopped on conflicts.\n\nFiles:\n%s\n\nResolve locally, push `%s`, and rerun the Super Nightly workflow.\n\nRun: %s/%s/actions/runs/%s' \
              "$FORK_BRANCH" "$base_sha" "$UPSTREAM_REPOSITORY" "$(git rev-parse upstream/main)" "$conflicts" "$FORK_BRANCH" \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
            existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
            if [[ -n "$existing" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" -f body="$body" >/dev/null
            else
              gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null
            fi
            echo "::error::${title}"
            exit 1
          fi

          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

      - id: check
        name: Compare candidate to the last Super Nightly release
        run: |
          last_tag="$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)"
          if [[ -z "$last_tag" ]]; then
            echo "No previous Super Nightly tag. Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(git rev-parse "$last_tag^{tree}")" == "$(git rev-parse "HEAD^{tree}")" ]]; then
            echo "Tree unchanged since $last_tag. Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes since $last_tag. Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: [sync]
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - id: release_meta
        name: Resolve release version
        env:
          NIGHTLY_DATE: ${{ github.run_started_at }}
        run: |
          node scripts/resolve-nightly-release.ts \
            --date "$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ needs.sync.outputs.candidate_sha }}" \
            --github-output

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel nightly \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  quality:
    name: Release quality checks
    needs: [sync, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install C toolchain for process-tree fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          command -v cc

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

  build_wsl_node_pty:
    name: Build WSL node-pty (linux-x64)
    needs: [sync, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty linux-x64 prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    name: Build Windows x64
    needs: [sync, preflight, build_wsl_node_pty]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Resolve Windows package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-release-packages-v1-x64-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/x86_64-pc-windows-msvc/release/t3-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_UPDATE_TOKEN: ${{ secrets.T3CODE_DESKTOP_UPDATE_TOKEN }}
        run: |
          if [[ -z "${T3CODE_DESKTOP_UPDATE_TOKEN}" ]]; then
            echo "::warning::T3CODE_DESKTOP_UPDATE_TOKEN is not set; this build cannot self-update from the private release feed."
          fi
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.exe release/*.blockmap release/*.yml; do
            cp "$file" release-publish/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish Super Nightly
    needs: [sync, preflight, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.candidate_sha }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Promote candidate to ${{ env.FORK_BRANCH }}
        run: |
          git push --force-with-lease="refs/heads/${FORK_BRANCH}:${{ needs.sync.outputs.base_sha }}" \
            origin "${{ needs.sync.outputs.candidate_sha }}:refs/heads/${FORK_BRANCH}"
          git push origin --delete "${CANDIDATE_BRANCH}"

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.sync.outputs.candidate_sha }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.sync.outputs.candidate_sha }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  report_failure:
    name: Report failure
    needs: [sync, preflight, quality, build_wsl_node_pty, build, release]
    if: failure() && needs.sync.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Super Nightly failed"
          body="$(printf 'Candidate `%s` did not ship. `%s` was not moved.\n\nRun: %s/%s/actions/runs/%s' \
            "${{ needs.sync.outputs.candidate_sha }}" "$FORK_BRANCH" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [[ -n "$existing" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$body" >/dev/null
          fi
